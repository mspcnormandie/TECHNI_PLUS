<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TECHNI_PLUS — Cours n° 4 : Défaillances et pannes</title><style>

{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}.stats span{background:#163b52;padding:8px 12px;border-radius:10px}.feedback{border-left:4px solid #ff9c36;padding:14px;background:#17394b;margin:12px 0}.hidden{display:none!important}.muted{font-size:13px;color:#aac5d5}.report{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}.report div{padding:14px;background:#173d51;border-radius:12px}.report strong{display:block;font-size:24px;color:#5ce2ff}.notice{background:#17374a;padding:12px;border-radius:10px}.confetti{animation:pop .45s ease}@keyframes pop{50%{transform:scale(1.015);box-shadow:0 0 25px #3ef6bf55}}@media(max-width:680px){.layout{grid-template-columns:1fr}.side{display:flex;align-items:center;gap:12px}.character{width:100px;max-height:140px}.speech{flex:1}.panel{padding:16px}}
@media print{body{background:white;color:black}.top,.side,.controls,.btn,.notice{display:none!important}.panel{background:white;color:black;box-shadow:none;border:0}.report div{color:black;background:#eee}.report strong{color:black}}

.transition-panel{border:1px solid #27b9d7;border-radius:18px;padding:28px;background:linear-gradient(145deg,#12344c,#092438);text-align:center;animation:slideIn .35s ease}.transition-panel h2{color:#51ddf6}.transition-panel .brand{margin:14px 0}.transition-panel .btn{margin-top:18px}.transition-score{font-size:1.4rem;font-weight:800;color:#ffa23b}@keyframes slideIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
 .titlebar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.titlebar h1{margin:14px 0}.titlebar .controls{align-items:center}@media(max-width:680px){.titlebar{align-items:flex-start}.titlebar .controls{width:100%}.titlebar .btn{flex:1}}

.course-banner{display:block;width:100%;height:auto;border-radius:15px;box-shadow:0 12px 28px #0005;margin:0 0 18px}.course-banner-wrap{max-width:760px;margin:0 auto 4px}.course-banner{margin-bottom:6px}.titlebar h1{font-size:clamp(22px,3vw,34px);margin:5px 0 10px}@media(max-width:680px){.course-banner-wrap{max-width:100%}.course-banner{border-radius:9px;margin-bottom:6px}.titlebar h1{font-size:24px}}

/* Bandeau ultra compact */
.wrap{padding:8px 12px}.course-banner-wrap{max-width:none;width:100%;margin:0 0 8px}.course-banner{margin:0 0 3px;border-radius:8px;box-shadow:none}.titlebar{gap:6px;flex-wrap:wrap;margin-bottom:4px}.titlebar h1{font-size:clamp(18px,2.2vw,24px);margin:2px 0 4px;line-height:1.1}.titlebar .btn{padding:7px 10px;font-size:12px}.titlebar .controls{gap:5px}.top{gap:6px}.pill{padding:4px 8px}.panel{padding:16px}@media(max-width:680px){.course-banner-wrap{max-width:100%}.titlebar h1{font-size:19px}.titlebar .btn{padding:7px 8px}.wrap{padding:7px}}
.technician-controls{display:flex;flex-direction:column;gap:7px;margin-bottom:10px}.technician-controls .btn{width:100%;padding:9px 7px;font-size:12px}.course-banner{width:100%;height:auto;display:block}@media(max-width:680px){.side{display:flex;flex-wrap:wrap}.technician-controls{width:100%;flex-direction:row}.technician-controls .btn{flex:1}.side .character{width:100px}}

/* Bandeau à mi-hauteur, largeur totale, recadrage central sans déformation */
.course-banner{height:auto!important;aspect-ratio:6 / 1;object-fit:cover;object-position:center top;}

/* Interface compacte : commandes et réponses moins hautes */
.wrap{max-width:1180px;padding:5px 10px}
.course-banner-wrap{margin-bottom:5px}
.layout{gap:10px;grid-template-columns:minmax(0,1fr) 225px}
.panel{padding:11px;border-radius:12px}
.options{gap:5px;margin:9px 0}
.option{padding:8px 12px;border-radius:8px;font-size:14px;line-height:1.25;min-height:36px}
.btn{padding:7px 10px;border-radius:8px;font-size:13px;line-height:1.2;min-height:32px}
.technician-controls{gap:5px;margin-bottom:5px}
.technician-controls .btn{padding:6px 7px;font-size:11px;min-height:30px}
.stats{gap:5px;margin:7px 0}.stats span{padding:5px 8px;border-radius:7px;font-size:12px}
.bar{height:8px}.speech{padding:8px;border-radius:9px;font-size:13px;line-height:1.3}
.feedback{padding:8px;margin:6px 0}.character{max-height:225px}
input,select{padding:8px 10px;font-size:14px}label{margin:7px 0 3px}
h2{margin:7px 0;font-size:20px}.notice{padding:8px}
@media(max-width:680px){.layout{grid-template-columns:1fr}.side{gap:8px}.panel{padding:9px}.option{padding:9px 10px;font-size:14px}.character{max-height:115px}.wrap{padding:5px}}

/* Version confort : boutons légèrement agrandis sans perdre la compacité */
.option{padding:11px 13px;font-size:15px;line-height:1.3;min-height:43px}
.options{gap:7px;margin:11px 0}
.btn{padding:9px 12px;font-size:14px;min-height:38px}
.technician-controls .btn{padding:8px 9px;font-size:12px;min-height:36px}
.stats span{padding:6px 9px;font-size:13px}
@media(max-width:680px){.option{padding:10px 11px;font-size:14px}}

.question-illustration{float:right;width:min(35%,370px);height:270px;object-fit:cover;margin:-65px 0 8px 14px;border:2px solid #2b718d;border-radius:12px;background:#0b2035}
.panel::after{content:"";display:block;clear:both}
@media(max-width:900px){.question-illustration{width:35%;height:210px}}
@media(max-width:650px){.question-illustration{margin:8px 0;float:none;display:block;width:100%;height:auto;aspect-ratio:620/440;margin:8px 0}}

/* Le titre revient à la ligne avant la zone d’illustration. */
.question-title{max-width:62%;overflow-wrap:break-word;word-break:normal;line-height:1.22}
.question-illustration{clear:right}
@media(max-width:650px){.question-title{max-width:100%}.question-illustration{clear:both}}

.home-illustration{float:right;width:54%;height:auto;aspect-ratio:740/498;object-fit:cover;border:2px solid #36c7e9;border-radius:14px;margin:-72px 0 12px 16px}
.home-form{width:43%;min-width:0}
.home-form input,.home-form select{width:100%;box-sizing:border-box}
@media(max-width:780px){.home-illustration{float:none;display:block;width:100%;margin:10px 0}.home-form{width:100%}}

.mission-progress>div{border-radius:20px}

.mission-mark.passed{background:#43e768;border-color:#d9ffe5;box-shadow:0 0 7px #43e768}

.mission-progress-labels .active{color:#63edff;text-shadow:0 0 8px #159ac9}

'use strict';const QUESTIONS=[{"type":"q","prompt":"La défaillance correspond à…","options":["la perte de l’aptitude à accomplir une fonction requise","une opération de maintenance planifiée","un simple arrêt volontaire"],"correct":0,"why":"Une défaillance est la perte de l’aptitude d’un système à assurer une fonction requise.","illustration":"images/Q01.webp"},{"type":"q","prompt":"Un mode de défaillance est…","options":["le prix d’une réparation","la manière dont la défaillance se manifeste","le nom du technicien"],"correct":1,"why":"Le mode de défaillance correspond aux symptômes observables.","illustration":"images/Q02.webp"},{"type":"q","prompt":"Quel est l’objectif du constat de défaillance ?","options":["Relever les informations pour identifier la fonction et la chaîne en panne","Remplacer immédiatement tous les composants","Calculer le prix du système"],"correct":0,"why":"Le constat rassemble les informations utiles pour identifier la fonction et la chaîne fonctionnelle en panne.","illustration":"images/Q03.webp"},{"type":"q","prompt":"L’analyse de défaillance examine principalement…","options":["les horaires des opérateurs","les causes et les effets","la couleur des machines"],"correct":1,"why":"Elle étudie les causes et les effets pour prévenir ou corriger le problème.","illustration":"images/Q04.webp"},{"type":"q","prompt":"Que signifie AMDEC ?","options":["Analyse des Modes de Défaillances, de leurs Effets et de leur Criticité","Analyse des Machines et des Dépenses Électriques Courantes","Assistance Maintenance des Équipements Connectés"],"correct":0,"why":"L’AMDEC étudie les modes de défaillance, leurs effets et leur criticité.","illustration":"images/Q05.webp"},{"type":"q","prompt":"À quoi sert un arbre des défaillances ?","options":["À classer les outils dans l’atelier","À représenter les combinaisons d’événements menant à une défaillance","À mesurer la vitesse d’un moteur"],"correct":1,"why":"L’arbre des défaillances représente les événements qui peuvent conduire à un événement indésirable.","illustration":"images/Q06.webp"},{"type":"q","prompt":"Le diagramme d’Ishikawa permet de…","options":["classer les causes possibles d’un problème","calculer une note sur 20","identifier uniquement les défauts électriques"],"correct":0,"why":"Ishikawa organise les causes possibles, notamment selon les 5M.","illustration":"images/Q07.webp"},{"type":"q","prompt":"Quel ensemble correspond aux 5M du diagramme d’Ishikawa ?","options":["Matière, Matériel, Méthode, Main-d’œuvre, Milieu","Moteur, Mesure, Maintenance, Machine, Mécanique","Matière, Marché, Marque, Modèle, Montage"],"correct":0,"why":"Les 5M sont Matière, Matériel, Méthode, Main-d’œuvre et Milieu.","illustration":"images/Q08.webp"},{"type":"q","prompt":"La panne est…","options":["un événement de perte d’aptitude uniquement","l’état d’un système inapte à accomplir une fonction","une vérification de sécurité"],"correct":1,"why":"La panne désigne un état d’inaptitude du système.","illustration":"images/Q09.webp"},{"type":"q","prompt":"Une panne totale signifie que…","options":["le système ne fonctionne plus du tout","le système fonctionne à vitesse réduite","seul un voyant est éteint"],"correct":0,"why":"Lors d’une panne totale, le système ne remplit plus du tout sa fonction.","illustration":"images/Q10.webp"},{"type":"q","prompt":"Une panne partielle signifie que…","options":["la machine est toujours totalement arrêtée","le système fonctionne mais de manière réduite","la machine est neuve"],"correct":1,"why":"Lors d’une panne partielle, la fonction est encore assurée, mais de façon réduite.","illustration":"images/Q11.webp"},{"type":"q","prompt":"Quelle différence entre défaillance et panne est enseignée dans le cours ?","options":["La défaillance est un état et la panne un événement","Ce sont exactement deux synonymes","La défaillance est un événement et la panne un état"],"correct":2,"why":"La défaillance est un événement ; la panne est l’état qui en résulte.","illustration":"images/Q12.webp"},{"type":"q","prompt":"Quelle est la première étape du diagnostic de panne ?","options":["Identifier le fournisseur","Détecter la panne","Commander une nouvelle machine"],"correct":1,"why":"Le diagnostic commence par la détection de la panne.","illustration":"images/Q13.webp"},{"type":"q","prompt":"Après avoir détecté une panne, il faut…","options":["localiser l’endroit où elle se produit","arrêter le diagnostic","remplacer toutes les pièces"],"correct":0,"why":"Le diagnostic se poursuit par la localisation de la panne.","illustration":"images/Q14.webp"},{"type":"q","prompt":"La dernière étape du diagnostic de panne consiste à…","options":["peindre la machine","identifier les causes","remplir uniquement une fiche de présence"],"correct":1,"why":"Après détection et localisation, on identifie les causes.","illustration":"images/Q15.webp"},{"type":"q","prompt":"Quel enchaînement décrit le diagnostic de panne ?","options":["Réparer, vendre, tester","Détecter, localiser, identifier les causes","Commander, démonter, nettoyer"],"correct":1,"why":"Les trois étapes sont détecter, localiser et identifier les causes.","illustration":"images/Q16.webp"},{"type":"q","prompt":"Sur un extracteur, la courroie se casse puis le ventilateur s’arrête. Quel est l’événement de défaillance ?","options":["La rupture de la courroie","L’extracteur à l’arrêt","Le contrôle de l’opérateur"],"correct":0,"why":"La rupture de la courroie est l’événement qui provoque la perte de fonction.","illustration":"images/Q17.webp"},{"type":"q","prompt":"Dans le même exemple, quel est l’état de panne ?","options":["La courroie est commandée","L’extracteur ne fonctionne plus","Le technicien observe la machine"],"correct":1,"why":"L’extracteur arrêté est en état de panne.","illustration":"images/Q18.webp"},{"type":"q","prompt":"Un convoyeur tourne encore, mais beaucoup plus lentement que prévu. Il s’agit plutôt…","options":["d’une panne partielle","d’une panne totale","d’un fonctionnement nominal"],"correct":0,"why":"Le système assure encore sa fonction de façon réduite : panne partielle.","illustration":"images/Q19.webp"},{"type":"q","prompt":"Un moteur ne démarre plus du tout et ne remplit plus sa fonction. Il s’agit…","options":["d’une panne partielle","d’une panne totale","d’une maintenance préventive"],"correct":1,"why":"La fonction n’est plus assurée du tout : panne totale.","illustration":"images/Q20.webp"},{"type":"q","prompt":"Pour étudier les causes possibles liées à la méthode de travail, quel outil est adapté ?","options":["Le diagramme d’Ishikawa","Une fiche de paie","Un compteur de pièces"],"correct":0,"why":"Le diagramme d’Ishikawa comprend la famille « Méthode ».","illustration":"images/Q21.webp"},{"type":"q","prompt":"Un défaut de matière première relève de quelle famille des 5M ?","options":["Milieu","Matière","Main-d’œuvre"],"correct":1,"why":"La famille « Matière » regroupe les causes liées à la matière utilisée.","illustration":"images/Q22.webp"},{"type":"q","prompt":"Quel outil du cours permet d’étudier la criticité des modes de défaillance ?","options":["L’AMDEC","Le schéma d’implantation","Le planning des congés"],"correct":0,"why":"L’AMDEC prend en compte les modes de défaillance, leurs effets et leur criticité.","illustration":"images/Q23.webp"},{"type":"q","prompt":"Lors d’un constat de défaillance, quelle action est la plus pertinente ?","options":["Relever les symptômes et les informations utiles","Remplacer des pièces au hasard","Ignorer les conditions d’apparition"],"correct":0,"why":"Le constat vise à collecter des informations avant l’analyse et le diagnostic.","illustration":"images/Q24.webp"}];const TITLES=['Comprendre les défaillances et les outils d’analyse','Comprendre les pannes et leur diagnostic','Analyser des situations concrètes de maintenance'];const CONFIG={endpoint:'https://script.google.com/macros/s/AKfycbwKVgUd0J40olhoezMqed0e00OSfdbO5msSgv99xVToOEkbcewD0lb_RQb_ywYmUeBhlg/exec',classes:['2MPIA1','2M function home(){main.replaceChildren();add(main,el('h2','Identification du technicien'),el('p','Complète les champs pour commencer la mission.'));const accueilImg=el('img',undefined,'home-illustration');accueilImg.src='images/TECHNI_PLUS_Identification.webp';accueilImg.alt='Technicien Techni_plus préparant sa mission sur ordinateur';main.append(accueilImg);const form=el('form');form.classList.add('home-form');const fields={};for(const [key,label] of [['nom','Nom'],['prenom','Prénom']]){const l=el('label',label);const inp=el('input');inp.required=true;inp.maxLength=60;inp.autocomplete='off';fields[key]=inp;add(form,l,inp)}add(form,el('label','Classe'));const select=el('select');for(const c of CONFIG.classes){const op=el('option',c);op.value=c;select.append(op)}const other=el('input');other.placeholder='Autre classe (si nécessaire)';other.maxLength=40;other.className='hidden';select.onchange=()=>other.classList.toggle('hidden',select.value!=='Autre');add(form,select,other,el('p','Les résultats sont envoyés automatiquement au professeur à la fin du jeu.','notice'));const start=el('button','COMMENCER LA MISSION','btn');start.type='submit';form.append(start);form.onsubmit=e=>{e.preventDefault();const nom=fields.nom.value.trim(),prenom=fields.prenom.value.trim(),classe=select.value==='Autre'?other.value.trim():select.value;if(!nom||!prenom||!classe){alert('Remplis tous les champs.');return}state={index:0,answers:[],xp:0,shields:3,person:{nom,prenom,classe},id:makeId(),sent:false,jokerUsed:false};activeQuestions=newQuestions();render()};main.append(form);say('Salut ! Indique ton identité puis lance la mission.')}function makeId(){return crypto?.randomUUID?.()||'tp-'+Date.now()+'-'+Math.random().toString(36).slice(2)}
function render(){changerImage(state.index);if(state.index>=24)return report();locked=false;const q=activeQuestions[state.index],mi=Math.floor(state.index/8);main.replaceChildren();add(main,el('div',`MISSION ${mi+1} / 3 — ${TITLES[mi]}`,'brand'),el('h2',`Défi ${state.index+1} / 24`));const bar=el('div',undefined,'bar'),fill=el('div');fill.style.width=(state.index/24*100)+'%';bar.append(fill);bar.classList.add('mission-progress');for(const pct of [100/3,200/3]){const marker=el('span',undefined,'level-change-marker');marker.style.left=pct+'%';marker.setAttribute('aria-label','Changement de niveau');bar.append(marker)}const labels=el('div',undefined,'mission-progress-labels');for(let j=0;j<3;j++){const label=el('span',['🎯 NIVEAU 1 : Identification','⚙️ NIVEAU 2 : Analyse','🛠️ NIVEAU 3 : Diagnostic'][j],mi===j?'active':'');labels.append(label)}main.append(labels);main.append(bar);const stats=el('div',undefined,'stats');add(stats,el('span',`⭐ ${state.xp} XP`),el('span',`🛡️ ${state.shields} joker${state.shields>1?"s":""} restant${state.shields>1?"s":""}`),el('span',`✔ ${state.answers.filter(Boolean).length} bonnes réponses`));main.append(stats);const questionTitle=el('h2',q.prompt,'question-title');main.append(questionTitle);if(q.type==='match')main.append(el('p','Choisis l’association entièrement correcte.','sub'));if(q.type==='fill')main.append(el('p','Choisis le mot qui complète la phrase.','sub'));const ill=el('img',undefined,'question-illustration');ill.src=q.illustration;ill.alt='Illustration pédagogique : '+q.prompt;ill.loading='eager';main.append(ill);const opts=el('div',undefined,'options');q.options.forEach((o,i)=>{const b=el('button',o,'option');b.onclick=()=>answer(i,opts);opts.append(b)});main.append(opts);

function useJoker(opts){
 if(locked||state.jokerUsed||state.shields<=0)return;
 const q=activeQuestions[state.index];
 const candidates=[...opts.children].map((b,i)=>i).filter(i=>i!==q.correct&&!opts.children[i].disabled);
 if(!candidates.length)return;
 const remove=candidates[Math.floor(Math.random()*candidates.length)];
 opts.children[remove].disabled=true;
 opts.children[remove].classList.add('eliminated');
 state.shields--;state.jokerUsed=true;
 const help=main.querySelector('.joker-help');if(help)help.disabled=true;
 const stats=main.querySelector('.stats');if(stats&&stats.children[1])stats.children[1].textContent=`🛡️ ${state.shields} joker${state.shields>1?'s':''} restant${state.shields>1?'s':''}`;
 say('Bouclier utilisé ! Une mauvaise réponse est éliminée. Choisis parmi les réponses restantes.');

function answer(i,opts){if(locked)return;locked=true;const q=activeQuestions[state.index],ok=i===q.correct;state.answers.push(ok);if(ok)state.xp+=100;[...opts.children].forEach((b,j)=>{b.disabled=true;if(j===q.correct)b.classList.add('good');else if(j===i)b.classList.add('bad')});beep(ok);const fb=el('div',(ok?'✅ Bonne réponse ! ':'❌ Réponse incorrecte. ')+q.why,'feedback');add(main,fb,button(state.index===23?'VOIR MON BILAN':(state.index%8===7?'MISSION SUIVANTE':'DÉFI SUIVANT'),()=>{const finished=state.index%8===7&&state.index<23;state.index++;state.jokerUsed=false;if(finished)missionTransition();else render()}));main.classList.add('confetti');setTimeout(()=>main.classList.remove('confetti'),450);say(ok?'Bravo ! '+q.why:'Pas de panique ! '+q.why)}

function scores(){return [0,1,2].map(i=>state.answers.slice(i*8,i*8+8).filter(Boolean).length)}function result(){const s=scores(),total=s.reduce((a,b)=>a+b,0),note=Math.round(total/24*20*100)/100;return {cours:'Cours n° 4 — Défaillances et pannes',date:new Date().toISOString(),nom:state.person.nom,prenom:state.person.prenom,classe:state.person.classe,note,mission1:s[0],mission2:s[1],mission3:s[2],total,erreurs:24-total,xp:state.xp,statut:note>=CONFIG.successThreshold?'Réussi':'À renforcer',tentativeId:state.id}}

function csv(r){const keys=Object.keys(r),cell=v=>'"'+String(v??'').replace(/"/g,'""')+'"',body='\ufeff'+keys.map(cell).join(';')+'\r\n'+keys.map(k=>cell(r[k])).join(';')+'\r\n';const a=document.createElement('a'),url=URL.createObjectURL(new Blob([body],{type:'text/csv;charset=utf-8'}));a.href=url;a.download='bilan_techni_plus_'+r.tentativeId+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}

function transmit(btn,status){if(pending||state.sent)return;let endpoint=CONFIG.endpoint.trim();if(!endpoint){const entered=prompt('Colle ici l’URL de ton application Web Google Apps Script (elle se termine par /exec) :');if(entered===null)return;endpoint=entered.trim()}if(!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec(?:\?.*)?$/.test(endpoint)){status.textContent='Adresse incorrecte : colle l’URL Google Apps Script complète se terminant par /exec, puis réessaie.';return}pending=true;btn.disabled=true;status.textContent='Envoi en cours…';const cb='tpAck_'+Math.random().toString(36).slice(2),script=document.createElement('script');let done=false;const timeout=setTimeout(()=>finish(false,'Délai dépassé : vérifie la connexion et réessaie.'),15000);function finish(ok,msg){if(done)return;done=true;clearTimeout(timeout);delete window[cb];script.remove();pending=false;if(ok){state.sent=true;btn.disabled=true}else btn.disabled=false;status.textContent=msg}window[cb]=response=>{if(response&&response.ok===true&&response.tentativeId===state.id&&['created','duplicate'].includes(response.status))finish(true,response.status==='duplicate'?'Résultat déjà enregistré : confirmation du serveur.':'Résultat enregistré : confirmation du serveur.');else finish(false,'Le serveur a refusé l’enregistrement : '+String(response?.error||'réponse invalide'))};script.onerror=()=>finish(false,'Erreur réseau ou déploiement inaccessible. Réessaie.');const u=new URL(endpoint);u.searchParams.set('callback',cb);u.searchParams.set('payload',JSON.stringify(result()));script.src=u.toString();document.head.append(script)}
