'use strict';const QUESTIONS=[{"type":"q","prompt":"Quel est l’objectif général de la maintenance ?","options":["Maintenir ou rétablir un équipement pour assurer sa fonction","Remplacer systématiquement toutes les machines","Intervenir uniquement lorsque la production est arrêtée"],"correct":0,"why":"La maintenance maintient ou rétablit un système dans un état permettant d’accomplir sa fonction.","illustration":"images/Q01.webp"},{"type":"q","prompt":"Quelle norme définit la maintenance dans le cours ?","options":["NF C 18-510","NF EN 13306","ISO 9001 uniquement"],"correct":1,"why":"Le cours cite la norme NF EN 13306 (janvier 2018).","illustration":"images/Q02.webp"},{"type":"q","prompt":"Quelles sont les trois grandes familles d’actions de maintenance ?","options":["Techniques, administratives et de management","Mécaniques, hydrauliques et électriques","Préventives, commerciales et financières"],"correct":0,"why":"La maintenance comprend des actions techniques, administratives et de management.","illustration":"images/Q03.webp"},{"type":"q","prompt":"Une intervention directe sur une machine correspond à une action…","options":["administrative","de management","technique"],"correct":2,"why":"Les actions techniques concernent les interventions directes sur l’équipement.","illustration":"images/Q04.webp"},{"type":"q","prompt":"La gestion des documents et des plannings relève des actions…","options":["administratives","correctives curatives","techniques uniquement"],"correct":0,"why":"Les actions administratives couvrent notamment les documents et les plannings.","illustration":"images/Q05.webp"},{"type":"q","prompt":"L’organisation des ressources de maintenance relève principalement…","options":["de la gestion des stocks seulement","du management","du dépannage palliatif"],"correct":1,"why":"Le management comprend la planification et l’organisation des ressources.","illustration":"images/Q06.webp"},{"type":"q","prompt":"La maintenance intervient pendant…","options":["tout le cycle de vie du système","uniquement la première année","seulement après une panne"],"correct":0,"why":"Les actions de maintenance sont réalisées pendant le cycle de vie du système.","illustration":"images/Q07.webp"},{"type":"q","prompt":"La maintenance a aussi pour objectif de…","options":["garantir disponibilité, sécurité et qualité","supprimer tous les contrôles","augmenter systématiquement les coûts"],"correct":0,"why":"Le cours relie maintenance, fiabilité, disponibilité, coûts, sécurité et qualité.","illustration":"images/Q08.webp"},{"type":"q","prompt":"Quand réalise-t-on une maintenance préventive ?","options":["Après une panne détectée","Avant qu’une panne ne survienne","Uniquement après remplacement du système"],"correct":1,"why":"La maintenance préventive est réalisée avant qu’une panne ne survienne.","illustration":"images/Q09.webp"},{"type":"q","prompt":"La maintenance corrective est réalisée…","options":["après détection d’une panne","à dates fixes sans panne","pour organiser les équipes uniquement"],"correct":0,"why":"La maintenance corrective intervient après la détection d’une panne.","illustration":"images/Q10.webp"},{"type":"q","prompt":"La maintenance améliorative consiste à…","options":["réparer provisoirement une panne","modifier pour améliorer les performances","nettoyer uniquement les locaux"],"correct":1,"why":"Elle apporte des modifications pour améliorer les performances.","illustration":"images/Q11.webp"},{"type":"q","prompt":"Externaliser la maintenance signifie…","options":["confier des opérations à un prestataire ou par contrat","interdire toute intervention","réaliser toutes les interventions en interne"],"correct":0,"why":"L’externalisation repose sur la sous-traitance ou un contrat de maintenance.","illustration":"images/Q12.webp"},{"type":"q","prompt":"Une maintenance préventive systématique suit…","options":["un échéancier","uniquement l’apparition d’une panne","l’avis du client après réparation"],"correct":0,"why":"Le préventif systématique est organisé selon un échéancier.","illustration":"images/Q13.webp"},{"type":"q","prompt":"Une maintenance préventive conditionnelle dépend…","options":["de l’état du bien","uniquement du calendrier annuel","de la date de fabrication uniquement"],"correct":0,"why":"La maintenance conditionnelle se déclenche selon l’état observé du bien.","illustration":"images/Q14.webp"},{"type":"q","prompt":"Selon le cours, la maintenance prévisionnelle s’appuie sur…","options":["l’analyse de données recueillies par l’intelligence artificielle","un remplacement sans observation","un dépannage provisoire"],"correct":0,"why":"Le cours présente la prévisionnelle comme une analyse de données par l’IA.","illustration":"images/Q15.webp"},{"type":"q","prompt":"Quelle association est correcte ?","options":["Palliative = réparation définitive ; curative = dépannage provisoire","Palliative = dépannage provisoire ; curative = réparation définitive","Palliative = maintenance avant panne ; curative = externalisation"],"correct":1,"why":"Le dépannage palliatif est provisoire ; la réparation curative est définitive.","illustration":"images/Q16.webp"},{"type":"q","prompt":"Une courroie est remplacée à une échéance prévue par le fabricant. C’est une maintenance…","options":["préventive systématique","corrective palliative","corrective curative"],"correct":0,"why":"Une intervention planifiée selon un échéancier est préventive systématique.","illustration":"images/Q17.webp"},{"type":"q","prompt":"Un capteur indique une usure excessive avant la panne. On intervient selon son état : maintenance…","options":["corrective curative","préventive conditionnelle","administrative"],"correct":1,"why":"Le suivi de l’état du bien caractérise la maintenance conditionnelle.","illustration":"images/Q18.webp"},{"type":"q","prompt":"Une machine en panne est remise en marche provisoirement. Il s’agit d’une maintenance…","options":["corrective palliative","préventive systématique","améliorative"],"correct":0,"why":"La maintenance palliative est un dépannage provisoire après panne.","illustration":"images/Q19.webp"},{"type":"q","prompt":"Après une panne, un composant défectueux est réparé définitivement. Il s’agit d’une maintenance…","options":["préventive conditionnelle","corrective curative","externalisée obligatoirement"],"correct":1,"why":"La maintenance curative vise une réparation définitive.","illustration":"images/Q20.webp"},{"type":"q","prompt":"Une entreprise modifie une machine pour améliorer son rendement. Quelle forme de maintenance ?","options":["Améliorative","Corrective palliative","Préventive systématique"],"correct":0,"why":"Une modification qui améliore les performances relève de la maintenance améliorative.","illustration":"images/Q21.webp"},{"type":"q","prompt":"La maintenabilité est l’aptitude d’un système à…","options":["être maintenu ou rétabli dans un état fonctionnel","fonctionner sans aucune défaillance pendant une durée donnée","être vendu au meilleur prix"],"correct":0,"why":"La maintenabilité concerne la facilité à maintenir ou rétablir la fonction requise.","illustration":"images/Q22.webp"},{"type":"q","prompt":"La fiabilité est l’aptitude d’un système à…","options":["être réparé rapidement","accomplir sa fonction dans des conditions données pendant un temps donné","être démonté sans outil"],"correct":1,"why":"La fiabilité mesure la capacité à assurer la fonction dans des conditions et un temps donnés.","illustration":"images/Q23.webp"},{"type":"q","prompt":"Selon le cours, quel indicateur mesure le temps moyen entre défaillances ?","options":["MRT","MTTR","MTBF"],"correct":2,"why":"Le MTBF est le temps moyen entre défaillances ; MRT et MTTR concernent la maintenabilité.","illustration":"images/Q24.webp"}];const TITLES=['Comprendre les fonctions de maintenance','Identifier les formes et types de maintenance','Appliquer les notions en atelier'];const CONFIG={endpoint:'https://script.google.com/macros/s/AKfycbwKVgUd0J40olhoezMqed0e00 function home(){main.replaceChildren();add(main,el('h2','Identification du technicien'),el('p','Complète les champs pour commencer la mission.'));const accueilImg=el('img',undefined,'home-illustration');accueilImg.src='images/TECHNI_PLUS_Identification.webp';accueilImg.alt='Technicien Techni_plus préparant la maintenance d’une installation';main.append(accueilImg);const form=el('form');form.classList.add('home-form');const fields={};for(const [key,label] of [['nom','Nom'],['prenom','Prénom']]){const l=el('label',label);const inp=el('input');inp.required=true;inp.maxLength=60;inp.autocomplete='off';fields[key]=inp;add(form,l,inp)}add(form,el('label','Classe'));const select=el('select');for(const c of CONFIG.classes){const op=el('option',c);op.value=c;select.append(op)}const other=el('input');other.placeholder='Autre classe (si nécessaire)';other.maxLength=40;other.className='hidden';select.onchange=()=>other.classList.toggle('hidden',select.value!=='Autre');add(form,select,other,el('p','Les résultats sont envoyés automatiquement au professeur à la fin du jeu.','notice'));const start=el('button','COMMENCER LA MISSION','btn');start.type='submit';form.append(start);form.onsubmit=e=>{e.preventDefault();const nom=fields.nom.value.trim(),prenom=fields.prenom.value.trim(),classe=select.value==='Autre'?other.value.trim():select.value;if(!nom||!prenom||!classe){alert('Remplis tous les champs.');return}state={index:0,answers:[],xp:0,shields:3,person:{nom,prenom,classe},id:makeId(),sent:false,jokerUsed:false};activeQuestions=newQuestions();render()};main.append(form);say('Salut ! Indique ton identité puis lance la mission.')}function makeId(){return crypto?.randomUUID?.()||'tp-'+Date.now()+'-'+Math.random().toString(36).slice(2)}

function useJoker(opts){
 if(locked||state.jokerUsed||state.shields<=0)return;
 const q=activeQuestions[state.index];
 const candidates=[...opts.children].map((b,i)=>i).filter(i=>i!==q.correct&&!opts.children[i].disabled);
 if(!candidates.length)return;
 const remove=candidates[Math.floor(Math.random()*candidates.length)];
 opts.children[remove].disabled=true;
 opts.children[remove].classList.add('eliminated');
 state.shields--;state.jokerUsed=true;
 const help=main.querySelector('.joker-help');if(help)help.disabled=true;
 const stats=main.querySelector('.stats');if(stats&&stats.children[1])stats.children[1].textContent=`🛡️ ${state.shields} joker${state.shields>1?'s':''} restant${state.shields>1?'s':''}`;

function answer(i,opts){if(locked)return;locked=true;const q=activeQuestions[state.index],ok=i===q.correct;state.answers.push(ok);if(ok)state.xp+=100;[...opts.children].forEach((b,j)=>{b.disabled=true;if(j===q.correct)b.classList.add('good');else if(j===i)b.classList.add('bad')});beep(ok);const fb=el('div',(ok?'✅ Bonne réponse ! ':'❌ Réponse incorrecte. ')+q.why,'feedback');add(main,fb,button(state.index===23?'VOIR MON BILAN':(state.index%8===7?'MISSION SUIVANTE':'DÉFI SUIVANT'),()=>{const finished=state.index%8===7&&state.index<23;state.index++;state.jokerUsed=false;if(finished)missionTransition();else render()}));main.classList.add('confetti');setTimeout(()=>main.classList.remove('confetti'),450);say(ok?'Bravo ! '+q.why:'Pas de panique ! '+q.why)}
function missionTransition(){const completed=Math.floor(state.index/8),earned=state.answers.slice((completed-1)*8,completed*8).filter(Boolean).length;main.replaceChildren();const panel=el('div',undefined,'transition-panel');add(panel,el('div','🏆 MISSION '+completed+' TERMINÉE','brand'),el('h2',earned===8?'Mission parfaite !':earned>=5?'Bravo, mission accomplie !':'Mission terminée, continue tes efforts !'),el('p',`Tu as obtenu ${earned} bonne${earned>1?'s':''} réponse${earned>1?'s':''} sur 8.`, 'transition-score'),el('p',earned===8?'Techni_plus : « Excellent ! Tu maîtrises cette mission. »':earned>=5?'Techni_plus : « Beau travail ! Poursuis ta progression. »':'Techni_plus : « Chaque erreur aide à apprendre. Continue ! »'),el('div','PROCHAINE MISSION','brand'),el('h2',`Mission ${completed+1} — ${TITLES[completed]}`),el('p',['','Distingue la panne totale, la panne partielle et les étapes du diagnostic.','Applique les notions à des situations de maintenance concrètes.'][completed]));panel.append(button('🚀 COMMENCER LA MISSION '+(completed+1),render));main.append(panel);say(`Mission ${completed} terminée ! ${earned} bonnes réponses sur 8. Prépare-toi pour la mission ${completed+1} : ${TITLES[completed]}.`)}
function scores(){return [0,1,2].map(i=>state.answers.slice(i*8,i*8+8).filter(Boolean).length)}function result(){const s=scores(),total=s.reduce((a,b)=>a+b,0),note=Math.round(total/24*20*100)/100;return {cours:'Cours n° 2 — Fonctions et formes de maintenance',date:new Date().toISOString(),nom:state.person.nom,prenom:state.person.prenom,classe:state.person.classe,note,mission1:s[0],mission2:s[1],mission3:s[2],total,erreurs:24-total,xp:state.xp,statut:note>=CONFIG.successThreshold?'Réussi':'À renforcer',tentativeId:state.id}}

function csv(r){const keys=Object.keys(r),cell=v=>'"'+String(v??'').replace(/"/g,'""')+'"',body='\ufeff'+keys.map(cell).join(';')+'\r\n'+keys.map(k=>cell(r[k])).join(';')+'\r\n';const a=document.createElement('a'),url=URL.createObjectURL(new Blob([body],{type:'text/csv;charset=utf-8'}));a.href=url;a.download='bilan_techni_plus_'+r.tentativeId+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}

function transmit(btn,status){if(pending||state.sent)return;let endpoint=CONFIG.endpoint.trim();if(!endpoint){const entered=prompt('Colle ici l’URL de ton application Web Google Apps Script (elle se termine par /exec) :');if(entered===null)return;endpoint=entered.trim()}if(!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec(?:\?.*)?$/.test(endpoint)){status.textContent='Adresse incorrecte : colle l’URL Google Apps Script complète se terminant par /exec, puis réessaie.';return}pending=true;btn.disabled=true;status.textContent='Envoi en cours…';const cb='tpAck_'+Math.random().toString(36).slice(2),script=document.createElement('script');let done=false;const timeout=setTimeout(()=>finish(false,'Délai dépassé : vérifie la connexion et réessaie.'),15000);function finish(ok,msg){if(done)return;done=true;clearTimeout(timeout);delete window[cb];script.remove();pending=false;if(ok){state.sent=true;btn.disabled=true}else btn.disabled=false;status.textContent=msg}window[cb]=response=>{if(response&&response.ok===true&&response.tentativeId===state.id&&['created','duplicate'].includes(response.status))finish(true,response.status==='duplicate'?'Résultat déjà enregistré : confirmation du serveur.':'Résultat enregistré : confirmation du serveur.');else finish(false,'Le serveur a refusé l’enregistrement : '+String(response?.error||'réponse invalide'))};script.onerror=()=>finish(false,'Erreur réseau ou déploiement inaccessible. Réessaie.');const u=new URL(endpoint);u.searchParams.set('callback',cb);u.searchParams.set('payload',JSON.stringify(result()));script.src=u.toString();document.head.append(script)}
